<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>EB(s)</title>

<!-- Favicon (SVG inline, sin archivos externos) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Cpath d='M50 12 C50 12 24 46 24 66 C24 81 36 90 50 90 C64 90 76 81 76 66 C76 46 50 12 50 12 Z' fill='%23fff'/%3E%3C/svg%3E">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: Helvetica, Arial, sans-serif;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* corrige la barra de direcciones en móviles */
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    background: #000;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.28);
  }

  .title {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 0.35em;
    z-index: 2;
    color: #fff;
    font-size: clamp(1.6rem, 6vw, 3rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-align: center;
    width: 90%;
    justify-content: center;
    flex-wrap: wrap;
    pointer-events: none;
  }

  .links {
    position: absolute;
    bottom: calc(34px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    z-index: 2;
    width: 100%;
    justify-content: center;
    padding: 0 16px;
  }

  .links a {
    color: #fff;
    text-decoration: none;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.5);
    padding-bottom: 4px;
    transition: opacity 0.2s ease;
    white-space: nowrap;
  }

  .links a:hover { opacity: 0.7; }

  /* Ajustes específicos para pantallas pequeñas (celulares) */
  @media (max-width: 480px) {
    .links {
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      gap: 18px;
    }
    .links a {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
    }
    .title {
      letter-spacing: 0.18em;
    }
  }

  /* Móviles en orientación horizontal (poco alto) */
  @media (max-height: 420px) {
    .links {
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    }
    .title { top: 45%; }
  }
</style>
</head>
<body>
  <div class="stage">

    <video
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline="true"
      preload="auto"
    >
      <source src="https://res.cloudinary.com/mkk8uxao/video/upload/v1785891555/finalebs_wj4fcd.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <h1 class="title">
      <span>V</span><span>I</span><span>S</span><span>I</span><span>O</span><span>N</span><span>E</span><span>S</span>
    </h1>

    <div class="links">
      <a href="mailto:edenbloodsupply.contact@gmail.com">Correo</a>
      <a href="https://www.instagram.com/edenbloodstudios/" target="_blank" rel="noreferrer">Instagram</a>
    </div>
  </div>

  <script>
    // Refuerzo para que el autoplay funcione en todos los navegadores móviles,
    // incluso si el navegador bloquea el primer intento automático.
    const video = document.querySelector('video');
    const tryPlay = () => {
      const p = video.play();
      if (p !== undefined) {
        p.catch(() => {
          const resume = () => {
            video.play();
            document.removeEventListener('touchstart', resume);
            document.removeEventListener('click', resume);
          };
          document.addEventListener('touchstart', resume, { once: true });
          document.addEventListener('click', resume, { once: true });
        });
      }
    };
    if (video.readyState >= 2) {
      tryPlay();
    } else {
      video.addEventListener('loadeddata', tryPlay, { once: true });
    }
  </script>
</body>
</html>
