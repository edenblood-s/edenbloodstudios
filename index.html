<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
<title>EB(s)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: Helvetica, Arial, sans-serif;
    background: #000;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.28);
  }

 .links {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    z-index: 2;
  }

  .links a {
    color: #fff;
    text-decoration: none;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.5);
    padding-bottom: 4px;
    transition: opacity 0.2s ease;
  }

  .links a:hover { opacity: 0.7; }
</style>
</head>
<body>
  <div class="stage">
   
    <video autoplay muted loop playsinline>
      <source src="https://res.cloudinary.com/mkk8uxao/video/upload/v1785891555/finalebs_wj4fcd.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <h1 class="title">
      <span>V</span><span>I</span><span>S</span><span>I</span><span>O</span><span>N</span><span>E</span><span>S</span>
    </h1>

    <div class="links">
      <a href="edenbloodsupply.contact@gmail.com">Correo</a>
      <a href="https://www.instagram.com/edenbloodstudios/" target="_blank" rel="noreferrer">Instagram</a>
    </div>
  </div>
</body>
</html>
