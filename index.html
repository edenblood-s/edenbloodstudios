<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Sphere</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #E8EBF3;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  #sphere-host {
    position: relative;
    width: 100%;
    height: 100vh;
  }
  #hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(0,0,0,0.4);
    font-size: 14px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="sphere-host"></div>
<div id="hint">Arrastra para girar · pasa el mouse sobre una imagen · clic para enfocar</div>

<!-- three.js desde CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* ============ CONFIG ============ */
const RADIUS = 180;
const PLANE_SIZE = 50;
const AUTO_ROT_Y = 0.0005;
const AUTO_ROT_X = 0.0002;
const DRAG_EASE = 0.2;
const HOVER_SCALE = 1.2;
const SCALE_EASE = 0.1;
const OPACITY_EASE = 0.12;
const INERTIA_DECAY = 0.94;
const FLICK_SCALE = 0.9;

const CLICK_SLOP = 6;
const FOCUS_EASE = 0.14;
const FOCUS_DISTANCE = 300;
const FOCUS_FILL = 0.62;
const BACKDROP_DIM = 0.16;

/* ============ ENGINE (traducido de engine.ts, sin tipos) ============ */
class ImageSphere {
  constructor(host, imageUrls, opts = {}) {
    this.host = host;
    this.scene = new THREE.Scene();
    this.group = new THREE.Group();
    this.planes = [];

    this.raycaster = new THREE.Raycaster();
    this.mouse = new THREE.Vector2(-2, -2);
    this.hovered = null;
    this.focused = null;

    this.rotationX = 0;
    this.rotationY = 0;
    this.currentRotationX = 0;
    this.currentRotationY = 0;
    this.baseRotationX = 0;
    this.baseRotationY = 0;

    this.dragging = false;
    this.startX = 0;
    this.startY = 0;

    this.velX = 0;
    this.velY = 0;
    this.lastDX = 0;
    this.lastDY = 0;

    this.invQuat = new THREE.Quaternion();
    this.worldPos = new THREE.Vector3();
    this.centerPos = new THREE.Vector3();
    this.tmpPos = new THREE.Vector3();

    this.raf = 0;
    this.running = false;
    this.disposed = false;
    this.cleanup = [];

    const w = host.clientWidth || 1;
    const h = host.clientHeight || 1;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    this.renderer.setPixelRatio(dpr);
    this.renderer.setClearColor(0x000000, 0);
    this.renderer.setSize(w, h);
    const canvas = this.renderer.domElement;
    Object.assign(canvas.style, {
      position: "absolute",
      inset: "0",
      width: "100%",
      height: "100%",
      display: "block",
      cursor: "grab",
    });
    host.appendChild(canvas);

    this.camera = new THREE.PerspectiveCamera(opts.fov ?? 25, w / h, 0.1, 2000);
    this.camera.position.z = opts.distance ?? 520;
    this.scene.add(this.group);

    this.loadPlanes(imageUrls);
    this.bindEvents();
  }

  isVideoUrl(url) {
    return /\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(url);
  }

  placeAndAdd(plane, aspect) {
    plane.userData = { isHovered: false, opacity: 0, focus: 0, aspect };
    plane.material.opacity = 0;

    const phi = (Math.random() * 2 - 1) * Math.PI;
    const theta = Math.random() * Math.PI * 2;
    const r = RADIUS + (Math.random() - 0.5) * 80;
    plane.position.set(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi),
    );

    plane.userData.home = plane.position.clone();

    this.group.add(plane);
    this.planes.push(plane);

    if (!this.running) this.renderStill();
  }

  loadVideoPlane(url) {
    const video = document.createElement("video");
    video.src = url;
    video.crossOrigin = "anonymous";
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.autoplay = true;

    // Guardamos el elemento para poder pausar/limpiar al destruir
    this.videos = this.videos || [];
    this.videos.push(video);

    const onReady = () => {
      if (this.disposed) return;
      const tex = new THREE.VideoTexture(video);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;

      const aspect = (video.videoWidth || 1) / (video.videoHeight || 1);
      const geo = new THREE.PlaneGeometry(PLANE_SIZE * aspect, PLANE_SIZE);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      mat.depthWrite = false;
      const plane = new THREE.Mesh(geo, mat);

      this.placeAndAdd(plane, aspect);
      video.play().catch(() => {});
    };

    video.addEventListener("loadedmetadata", onReady, { once: true });
    video.load();
  }

  loadImagePlane(url) {
    const loader = new THREE.TextureLoader();
    loader.crossOrigin = "anonymous";
    loader.load(url, (tex) => {
      if (this.disposed) return;
      tex.anisotropy = this.renderer.capabilities.getMaxAnisotropy();
      tex.minFilter = THREE.LinearMipMapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.colorSpace = THREE.SRGBColorSpace;

      const aspect = (tex.image.width || 1) / (tex.image.height || 1);
      const geo = new THREE.PlaneGeometry(PLANE_SIZE * aspect, PLANE_SIZE);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      mat.depthWrite = false;
      const plane = new THREE.Mesh(geo, mat);

      this.placeAndAdd(plane, aspect);
    });
  }

  loadPlanes(urls) {
    urls.forEach((url) => {
      if (this.isVideoUrl(url)) this.loadVideoPlane(url);
      else this.loadImagePlane(url);
    });
  }

  bindEvents() {
    const host = this.host;
    const localMouse = (clientX, clientY) => {
      const rect = host.getBoundingClientRect();
      this.mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      this.mouse.y = -(((clientY - rect.top) / rect.height) * 2 - 1);
    };

    let downX = 0;
    let downY = 0;
    const onDown = (e) => {
      this.dragging = true;
      this.startX = e.clientX;
      this.startY = e.clientY;
      downX = e.clientX;
      downY = e.clientY;
      this.velX = this.velY = 0;
      this.lastDX = this.lastDY = 0;
      this.renderer.domElement.style.cursor = "grabbing";
    };
    const onMove = (e) => {
      localMouse(e.clientX, e.clientY);
      if (this.dragging) {
        const dx = e.clientX - this.startX;
        const dy = e.clientY - this.startY;
        this.rotationY += dx * 1.0;
        this.rotationX -= dy * 1.0;
        this.lastDX = dx;
        this.lastDY = dy;
        this.startX = e.clientX;
        this.startY = e.clientY;
      }
    };
    const release = () => {
      if (!this.dragging) return;
      this.dragging = false;
      this.velY = this.lastDX * FLICK_SCALE;
      this.velX = -this.lastDY * FLICK_SCALE;
      this.renderer.domElement.style.cursor = "grab";
    };
    const onUp = (e) => {
      const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
      release();
      if (moved <= CLICK_SLOP && this.running) {
        this.velX = this.velY = 0;
        localMouse(e.clientX, e.clientY);
        const hit = this.pick();
        if (this.focused) this.focused = hit === this.focused ? null : hit;
        else this.focused = hit;
      }
    };
    const onLeave = () => {
      release();
      this.mouse.set(-2, -2);
    };
    const onKey = (e) => {
      if (e.key === "Escape" && this.focused) this.focused = null;
    };
    window.addEventListener("keydown", onKey);
    this.cleanup.push(() => window.removeEventListener("keydown", onKey));

    host.addEventListener("pointerdown", onDown);
    host.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    host.addEventListener("pointerleave", onLeave);
    this.cleanup.push(() => {
      host.removeEventListener("pointerdown", onDown);
      host.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      host.removeEventListener("pointerleave", onLeave);
    });

    this.ro = new ResizeObserver(() => this.resize());
    this.ro.observe(host);
  }

  resize() {
    if (this.disposed) return;
    const w = this.host.clientWidth;
    const h = this.host.clientHeight;
    if (!w || !h) return;
    this.renderer.setSize(w, h);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  pick() {
    this.raycaster.setFromCamera(this.mouse, this.camera);
    const hits = this.raycaster.intersectObjects(this.planes, false);
    return hits.length > 0 ? hits[0].object : null;
  }

  hoverDetection() {
    const next = this.pick();
    if (next !== this.hovered) {
      if (this.hovered) this.hovered.userData.isHovered = false;
      this.hovered = next;
      if (this.hovered) this.hovered.userData.isHovered = true;
    }
  }

  start() {
    if (this.running || this.disposed) return;
    this.running = true;
    this.raf = requestAnimationFrame(this.loop);
  }

  stop() {
    this.running = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
  }

  loop = () => {
    if (!this.running) return;

    if (!this.dragging && (this.velX !== 0 || this.velY !== 0)) {
      this.rotationY += this.velY;
      this.rotationX -= this.velX;
      this.velX *= INERTIA_DECAY;
      this.velY *= INERTIA_DECAY;
      if (Math.abs(this.velX) < 0.01) this.velX = 0;
      if (Math.abs(this.velY) < 0.01) this.velY = 0;
    }

    this.baseRotationY += AUTO_ROT_Y;
    this.baseRotationX += AUTO_ROT_X;
    this.currentRotationX += (this.rotationX - this.currentRotationX) * DRAG_EASE;
    this.currentRotationY += (this.rotationY - this.currentRotationY) * DRAG_EASE;
    this.group.rotation.x = this.baseRotationX + this.currentRotationX * 0.002;
    this.group.rotation.y = this.baseRotationY + this.currentRotationY * 0.002;

    if (!this.dragging && !this.focused) this.hoverDetection();
    else if (this.focused && this.hovered) {
      this.hovered.userData.isHovered = false;
      this.hovered = null;
    }
    const anyFocused = this.focused !== null;

    this.centerPos.set(0, 0, this.camera.position.z - FOCUS_DISTANCE);
    const viewH = 2 * FOCUS_DISTANCE * Math.tan((this.camera.fov * Math.PI) / 360);
    const focusScale = (viewH * FOCUS_FILL) / PLANE_SIZE;

    this.invQuat.copy(this.group.quaternion).invert();
    for (const plane of this.planes) {
      plane.quaternion.copy(this.invQuat);

      const focusTarget = plane === this.focused ? 1 : 0;
      const f = plane.userData.focus + (focusTarget - plane.userData.focus) * FOCUS_EASE;
      plane.userData.focus = f;

      if (f > 0.0005) {
        this.tmpPos.copy(this.centerPos);
        this.group.worldToLocal(this.tmpPos);
        plane.position.copy(plane.userData.home).lerp(this.tmpPos, f);
      } else if (plane.position.x !== plane.userData.home.x || plane.position.z !== plane.userData.home.z) {
        plane.position.copy(plane.userData.home);
      }

      plane.getWorldPosition(this.worldPos);
      const depth = this.worldPos.z;

      const zScale = 0.8 + depth / 2000;
      let target = plane.userData.isHovered ? zScale * HOVER_SCALE : zScale;
      target = target + (focusScale - target) * f;
      const s = plane.scale.x + (target - plane.scale.x) * SCALE_EASE;
      plane.scale.set(s, s, s);

      let wantOpacity = 1;
      if (anyFocused) wantOpacity = BACKDROP_DIM + (1 - BACKDROP_DIM) * f;
      const o = plane.userData.opacity + (wantOpacity - plane.userData.opacity) * OPACITY_EASE;
      plane.userData.opacity = o;
      plane.material.opacity = o;

      plane.renderOrder = f > 0.5 ? 1 : 0;
    }

    this.renderer.render(this.scene, this.camera);
    this.raf = requestAnimationFrame(this.loop);
  };

  renderStill() {
    this.invQuat.copy(this.group.quaternion).invert();
    for (const plane of this.planes) {
      plane.quaternion.copy(this.invQuat);
      plane.getWorldPosition(this.worldPos);
      const zScale = 0.8 + this.worldPos.z / 2000;
      plane.scale.set(zScale, zScale, zScale);
      plane.userData.opacity = 1;
      plane.material.opacity = 1;
    }
    this.renderer.render(this.scene, this.camera);
  }

  destroy() {
    this.disposed = true;
    this.stop();
    this.cleanup.forEach((fn) => fn());
    this.ro?.disconnect();
    for (const plane of this.planes) {
      plane.geometry.dispose();
      const mat = plane.material;
      mat.map?.dispose();
      mat.dispose();
    }
    (this.videos || []).forEach((v) => {
      v.pause();
      v.src = "";
      v.load();
    });
    this.renderer.dispose();
    this.renderer.forceContextLoss?.();
    const canvas = this.renderer.domElement;
    canvas.parentNode?.removeChild(canvas);
  }
}

/* ============ USO ============ */
// Reemplaza estas URLs por tus propias imágenes (mismo dominio o con CORS habilitado)
const imageUrls = [
  "https://picsum.photos/seed/1/300/300",
  "https://picsum.photos/seed/2/300/400",
  "https://picsum.photos/seed/3/400/300",
  "https://picsum.photos/seed/4/300/300",
  "https://picsum.photos/seed/5/300/300",
  "https://picsum.photos/seed/6/400/300",
  "https://picsum.photos/seed/7/300/400",
  "https://picsum.photos/seed/8/300/300",
  "https://picsum.photos/seed/9/300/300",
  "https://picsum.photos/seed/10/400/300",
  "https://picsum.photos/seed/11/300/300",
  "https://picsum.photos/seed/12/300/400",
  "https://picsum.photos/seed/13/300/300",
  "https://picsum.photos/seed/14/400/300",
  "https://picsum.photos/seed/15/300/300",
  "https://picsum.photos/seed/16/300/300",
  "https://picsum.photos/seed/17/300/400",
  "https://picsum.photos/seed/18/400/300",
  "https://picsum.photos/seed/19/300/300",
  "https://picsum.photos/seed/20/300/300",
  // Ejemplo de video: cualquier url .mp4/.webm se detecta automáticamente
  "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
];

const host = document.getElementById("sphere-host");
const sphere = new ImageSphere(host, imageUrls, { distance: 520, fov: 25 });
sphere.start();
</script>

</body>
</html>
